                        <div style="margin-top:10px;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <label style="margin:0;">1. 주인공이 겉으로 원하는 것 (Want / 욕망)</label>
                            </div>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>주인공이 초반에 자신이 원한다고 굳게 믿는 가짜 목표나 피상적 욕망입니다.<br><strong>예시:</strong> "친구들에게 인정받는 전략가가 되고 싶다", "무조건 많은 돈을 벌어 복수하겠다"</p>
                            </details>
                            <textarea rows="2" placeholder="겉으로 드러난 욕망" oninput="updateMainlineField(${s.id}, 'want', this.value)">${escapeHtml(m.want || '')}</textarea>
                        </div>

                        <!-- 2. Need -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">2. 주인공에게 진짜 필요한 것 (Need / 결핍)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>성장하기 위해 버려야 할 환상이자 진정한 내면의 깨달음입니다. Want와 충돌합니다.<br><strong>예시:</strong> "남의 인정 없이도 자기 판단을 믿는 것", "증오를 내려놓고 곁에 남은 사람들을 지키는 것"</p>
                            </details>
                            <textarea rows="2" placeholder="주인공 내면의 진짜 결핍과 진실" oninput="updateMainlineField(${s.id}, 'need', this.value)">${escapeHtml(m.need || '')}</textarea>
                        </div>

                        <!-- 3. Goal -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">3. 이야기 전체의 최종 목표 (Story Goal)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>이야기 외적으로 명확히 성패가 판가름 나는 물리적 퀘스트 목표입니다.<br><strong>예시:</strong> "마왕군 총사령관의 요새를 함락시키고 국경을 방어하는 것"</p>
                            </details>
                            <textarea rows="2" placeholder="외적 승리 조건" oninput="updateMainlineField(${s.id}, 'goal', this.value)">${escapeHtml(m.goal || '')}</textarea>
                        </div>

                        <!-- 4. Penalty -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">4. 실패 시 치르는 대가 (Stakes / Penalty)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>목표 달성에 실패했을 때 주인공과 세계가 겪을 끔찍한 파국입니다.<br><strong>예시:</strong> "소꿉친구와 부대원 전원이 몰살당하고 나라는 멸망한다"</p>
                            </details>
                            <textarea rows="2" placeholder="실패했을 때의 치명적 대가" oninput="updateMainlineField(${s.id}, 'penalty', this.value)">${escapeHtml(m.penalty || '')}</textarea>
                        </div>

                        <!-- 5. Antagonist -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">5. 최종 장애물 / 대립 세력 (Antagonist)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>주인공의 결핍(Need)을 정면으로 후벼파며 목표를 방해하는 적대자나 거대한 시스템입니다.<br><strong>예시:</strong> "주인공의 옛 스승이자, 동료를 버려서라도 이기라고 강요하는 적국 대장군"</p>
                            </details>
                            <textarea rows="2" placeholder="최종 빌런 및 주요 장애물" oninput="updateMainlineField(${s.id}, 'antagonist', this.value)">${escapeHtml(m.antagonist || '')}</textarea>
                        </div>

                        <!-- 6. Ending -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">6. 결말에서 주인공의 변화 (Ending / 결말부터 정하기)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>이야기 시작 시점과 비교했을 때 주인공의 가치관과 태도가 어떻게 달라져 있는가?<br><strong>예시:</strong> "타인의 칭찬에 연연하지 않고, 실패의 무게를 담담히 감당하는 진정한 사령관으로 거듭난다"</p>
                            </details>
                            <textarea rows="2" placeholder="시작과 완전히 달라진 주인공의 모습" oninput="updateMainlineField(${s.id}, 'ending', this.value)">${escapeHtml(m.ending || '')}</textarea>
                        </div>

                        <!-- 7. Summary -->
                        <div style="margin-top:6px;">
                            <label style="margin:0;">7. 메인 스토리라인 한 문단 요약 (Logline Extension)</label>
                            <details class="guide-box">
                                <summary>💡 어떻게 쓰나요?</summary>
                                <p>위 1~6번 항목을 하나의 유기적인 문단으로 엮어 쓴 전체 서사의 축약본입니다.<br><strong>예시:</strong> "[주인공]은 [Want]를 좇지만 [Antagonist]에 막혀 [Penalty]의 위기에 처한다. 하지만 [Need]를 깨닫고 결단을 내려 마침내 [Goal]을 이루며 [Ending]으로 도약한다."</p>
                            </details>
                            <textarea rows="3" placeholder="위 항목들을 이어 쓴 한 문단 뼈대" oninput="updateMainlineField(${s.id}, 'summary', this.value)">${escapeHtml(m.summary || '')}</textarea>
                        </div>
                    </div>

                    <!-- 전환점 섹션 및 기본 틀 불러오기 (A-3) -->
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h4 style="margin:0; font-size:1rem;">📜 전환점 & 정보 공개 사다리</h4>
                        <div style="display:flex; gap:6px;">
                            <button class="btn btn-ghost btn-small" onclick="loadDefaultArcPoints(${s.id})">⚡ 기승전결 기본 틀 불러오기</button>
                            <button class="btn btn-ghost btn-small" onclick="addArcPoint(${s.id})">+ 전환점</button>
                        </div>
                    </div>
                    <p style="font-size:0.78rem; color:var(--text-muted); margin-bottom:14px;">
                        독자의 기대를 <strong>예측가능 → 예측붕괴 → 재해석</strong>으로 이끌고, 캐릭터의 대면 카드를 적재적소에 배치하세요.
                    </p>

                    <div id="arc-point-list">
                        ${s.arcPoints.length === 0 ? '<div style="font-size:0.8rem; color:var(--text-muted); padding:10px 0;">등록된 전환점이 없습니다. "기승전결 기본 틀 불러오기" 버튼을 눌러보세요!</div>' : ''}
                        ${s.arcPoints.map((arc, idx) => `
                            <div class="sub-card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                    <span class="tag" style="background:var(--primary); color:white;">#${idx + 1} ${escapeHtml(arc.label || '전환점')}</span>
                                    <button class="btn btn-ghost btn-small" onclick="removeArcPoint(${s.id}, ${arc.id})">🗑️</button>
                                </div>
                                <div style="display:flex; gap:8px;">
                                    <div style="flex:1;">
                                        <label>구간 라벨</label>
                                        <input type="text" value="${escapeHtml(arc.label || '')}" placeholder="예: 발단 사건 / 클라이맥스" oninput="updateArcPointField(${s.id}, ${arc.id}, 'label', this.value)">
                                    </div>
                                    <div style="flex:1;">
                                        <label>정보 공개 단계</label>
                                        <select onchange="updateArcPointField(${s.id}, ${arc.id}, 'infoStage', this.value)">
                                            <option ${arc.infoStage === '예측가능' ? 'selected' : ''}>예측가능</option>
                                            <option ${arc.infoStage === '예측붕괴' ? 'selected' : ''}>예측붕괴</option>
                                            <option ${arc.infoStage === '재해석' ? 'selected' : ''}>재해석</option>
                                        </select>
                                    </div>
                                </div>

                                <label>이 지점에서 일어나는 사건</label>
                                <textarea rows="2" placeholder="독자의 예상을 뒤흔들고 전개를 꺾는 핵심 사건을 구체적으로 적으세요" oninput="updateArcPointField(${s.id}, ${arc.id}, 'note', this.value)">${escapeHtml(arc.note || '')}</textarea>

                                <label>연계 캐릭터 대면 카드</label>
                                <select onchange="updateArcPointField(${s.id}, ${arc.id}, 'linkedConfrontationCharacterId', this.value)">
                                    <option value="">연계 대면 카드 없음</option>
                                    ${s.characters.map(c => `
                                        <option value="${c.id}" ${arc.linkedConfrontationCharacterId == c.id ? 'selected' : ''}>
                                            ${escapeHtml(c.name)}: ${escapeHtml(c.confrontation ? c.confrontation.substring(0, 20) + '...' : '대면 카드')}
                                        </option>
                                    `).join('')}
                                </select>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (tab === 'episodes') {
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h4 style="margin:0; font-size:1rem;">🎬 회차별 템플릿 목록 (${s.episodes.length}화)</h4>
                        <button class="btn btn-primary btn-small" onclick="addEpisodeItem(${s.id})">+ 회차 추가</button>
                    </div>

                    <div id="episodes-container">
                        ${s.episodes.length === 0 ? '<div style="font-size:0.8rem; color:var(--text-muted); padding:10px 0;">에피소드가 없습니다. 첫 회차를 추가해 글을 전개해 보세요!</div>' : ''}
                        ${s.episodes.map((ep, idx) => `
                            <div class="sub-card">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                                    <strong>제 ${idx + 1}화</strong>
                                    <button class="btn btn-ghost btn-small" onclick="removeEpisodeItem(${s.id}, ${ep.id})">🗑️</button>
                                </div>

                                <label>소제목</label>
                                <input type="text" value="${escapeHtml(ep.title || '')}" placeholder="회차 제목" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'title', this.value)">

                                <div style="display:flex; gap:8px;">
                                    <div style="flex:1;">
                                        <label>이번 화 목표</label>
                                        <input type="text" value="${escapeHtml(ep.goal || '')}" placeholder="주인공의 즉각적 목표" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'goal', this.value)">
                                    </div>
                                    <div style="flex:1;">
                                        <label>실패 시 패널티</label>
                                        <input type="text" value="${escapeHtml(ep.penalty || '')}" placeholder="놓칠 경우 치를 대가" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'penalty', this.value)">
                                    </div>
                                </div>

                                <div style="display:flex; gap:8px;">
                                    <div style="flex:1;">
                                        <label>봉착한 문제</label>
                                        <textarea rows="2" placeholder="작은 갈등과 장애물" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'problem', this.value)">${escapeHtml(ep.problem || '')}</textarea>
                                    </div>
                                    <div style="flex:1;">
                                        <label>해결 (캐릭터성 반영)</label>
                                        <textarea rows="2" placeholder="캐릭터만의 방식으로 돌파" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'solution', this.value)">${escapeHtml(ep.solution || '')}</textarea>
                                    </div>
                                </div>

                                <label>내적 변화 (이 해결이 심리에 미친 영향)</label>
                                <input type="text" value="${escapeHtml(ep.innerChange || '')}" placeholder="가치관의 균열, 자각 등" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'innerChange', this.value)">

                                <label>관계 변화</label>
                                <input type="text" value="${escapeHtml(ep.relationshipChange || '')}" placeholder="인물 간 신뢰도, 거리감 변화" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'relationshipChange', this.value)">

                                <label>옳은 선택 (역경 속 결단)</label>
                                <input type="text" value="${escapeHtml(ep.rightChoice || '')}" placeholder="손해를 감수하고도 내린 올바른 결정" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'rightChoice', this.value)">

                                <label style="color:var(--accent);">마무리 훅 (다음 화를 누르게 할 미해결 질문)</label>
                                <input type="text" value="${escapeHtml(ep.hook || '')}" placeholder="예: 방 한구석에서 발견된 피 묻은 편지의 정체는?" oninput="updateEpisodeField(${s.id}, ${ep.id}, 'hook', this.value)">

                                <div style="display:flex; gap:8px;">
                                    <div style="flex:1;">
                                        <label>정보공개 사다리</label>
                                        <select onchange="updateEpisodeField(${s.id}, ${ep.id}, 'infoStage', this.value)">
                                            <option value="예측가능" ${ep.infoStage === '예측가능' ? 'selected' : ''}>예측가능</option>
                                            <option value="예측붕괴" ${ep.infoStage === '예측붕괴' ? 'selected' : ''}>예측붕괴</option>
                                            <option value="재해석" ${ep.infoStage === '재해석' ? 'selected' : ''}>재해석</option>
                                        </select>
                                    </div>
                                    <div style="flex:1;">
                                        <label>발동된 대면 카드</label>
                                        <select onchange="updateEpisodeConfrontation(${s.id}, ${ep.id}, this.value)">
                                            <option value="">선택 안 함</option>
                                            ${s.characters.map(c => `
                                                <option value="${c.id}" ${ep.confrontationCharacterId == c.id ? 'selected' : ''}>
                                                    ${escapeHtml(c.name)}의 대면
                                                </option>
                                            `).join('')}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        // --- 입력값 디바운스 업데이트 핸들러 (A-2) ---
        function updateStoryField(id, field, val) {
            const s = state.stories.find(x => x.id == id);
            if (!s) return;
            s[field] = val;
            saveDebounced();
        }

        function updateMainlineField(storyId, field, val) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            if (!s.mainline) s.mainline = {};
            s.mainline[field] = val;
            saveDebounced();
        }

        function updateCharacterField(storyId, charId, field, val) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            const c = s.characters.find(item => item.id == charId);
            if (!c) return;
            c[field] = val;
            saveDebounced();
        }

        function updateRelationshipField(storyId, relId, field, val) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            const r = s.relationships.find(item => item.id == relId);
            if (!r) return;
            r[field] = val;
            saveDebounced();
        }

        function updateArcPointField(storyId, arcId, field, val) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            const a = s.arcPoints.find(item => item.id == arcId);
            if (!a) return;
            a[field] = val;
            saveDebounced();
        }

        function updateEpisodeField(storyId, epId, field, val) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            const ep = s.episodes.find(item => item.id == epId);
            if (!ep) return;
            ep[field] = val;
            saveDebounced();
        }

        function updateEpisodeConfrontation(storyId, epId, charId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            const ep = s.episodes.find(item => item.id == epId);
            if (!ep) return;
            ep.confrontationCharacterId = charId || null;

            if (charId) {
                const c = s.characters.find(item => item.id == charId);
                if (c) {
                    c.confrontationUsed = true;
                    c.confrontationEpisodeIdx = s.episodes.indexOf(ep) + 1;
                }
            }
            saveDebounced();
        }

        // --- 구조 변경 (추가/삭제) 핸들러 ---
        function addCharacter(storyId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.characters.push({
                id: Date.now(),
                name: "",
                contradiction: "",
                avoidance: "",
                confrontation: "",
                confrontationUsed: false,
                confrontationEpisodeIdx: null
            });
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function removeCharacter(storyId, charId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.characters = s.characters.filter(c => c.id != charId);
            s.relationships = s.relationships.filter(r => r.characterAId != charId && r.characterBId != charId);
            s.episodes.forEach(ep => {
                if (ep.confrontationCharacterId == charId) ep.confrontationCharacterId = null;
            });
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function addRelationship(storyId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.relationships.push({
                id: Date.now(),
                characterAId: s.characters[0] ? s.characters[0].id : null,
                characterBId: s.characters[1] ? s.characters[1].id : null,
                description: "",
                irony: "",
                resolved: false
            });
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function removeRelationship(storyId, relId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.relationships = s.relationships.filter(r => r.id != relId);
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function addArcPoint(storyId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.arcPoints.push({
                id: Date.now(),
                label: "전환점",
                infoStage: "예측붕괴",
                note: "",
                linkedConfrontationCharacterId: null
            });
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        // A-3 기승전결 기본 틀 7개 전환점 불러오기
        function loadDefaultArcPoints(storyId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            if (s.arcPoints.length > 0) {
                if (!confirm("기존 전환점을 교체하고 7개 기본 틀(기승전결)을 불러오시겠습니까?")) return;
            }
            const defaults = [
                { label: "1. 발단 사건 (일상이 깨지는 순간)", infoStage: "예측가능" },
                { label: "2. 1막 끝 (되돌아갈 수 없는 선택)", infoStage: "예측가능" },
                { label: "3. 전개 중반의 시험", infoStage: "예측가능" },
                { label: "4. 중간점 (판이 뒤집히는 순간)", infoStage: "예측붕괴" },
                { label: "5. 최저점 (다 잃었다고 느끼는 순간)", infoStage: "예측붕괴" },
                { label: "6. 클라이맥스 (최종 대결, 대면 카드 발동)", infoStage: "재해석" },
                { label: "7. 결말 (변화된 주인공)", infoStage: "재해석" }
            ];

            s.arcPoints = defaults.map((d, idx) => ({
                id: Date.now() + idx,
                label: d.label,
                infoStage: d.infoStage,
                note: "",
                linkedConfrontationCharacterId: null
            }));

            saveImmediately();
            refreshStoryModalWithScroll();
            showToast("기승전결 7대 전환점 틀이 생성되었습니다.");
        }

        function removeArcPoint(storyId, arcId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.arcPoints = s.arcPoints.filter(a => a.id != arcId);
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function addEpisodeItem(storyId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.episodes.push({
                id: Date.now(),
                title: `제 ${s.episodes.length + 1}화`,
                goal: "",
                penalty: "",
                problem: "",
                solution: "",
                innerChange: "",
                relationshipChange: "",
                rightChoice: "",
                hook: "",
                infoStage: "예측가능",
                confrontationCharacterId: null
            });
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function removeEpisodeItem(storyId, epId) {
            const s = state.stories.find(x => x.id == storyId);
            if (!s) return;
            s.episodes = s.episodes.filter(ep => ep.id != epId);
            saveImmediately();
            refreshStoryModalWithScroll();
        }

        function openNewStoryModal() {
            openModal('새 이야기 만들기', `
                <label>이야기 제목</label>
                <input type="text" id="s-title" placeholder="작품 제목">
                <label>한 줄 로그라인</label>
                <input type="text" id="s-logline" placeholder="주인공이 마주한 결핍과 목표">
                <label>메인 테마 / 독자 로망</label>
                <input type="text" id="s-theme" placeholder="예: 구원과 성장 / 최고의 전문가가 되는 쾌감">
                <label>전체 줄거리 요약</label>
                <textarea id="s-plot" placeholder="전체 줄거리 요약" rows="3"></textarea>
            `, saveNewStory);
        }

        function saveNewStory() {
            const titleInput = document.getElementById('s-title');
            if (!titleInput.value.trim()) {
                alert("제목을 입력해 주세요.");
                return;
            }
            const s = {
                id: Date.now(),
                title: titleInput.value.trim(),
                logline: document.getElementById('s-logline').value.trim(),
                theme: document.getElementById('s-theme').value.trim(),
                fantasy: "",
                plot: document.getElementById('s-plot').value.trim(),
                status: '구상 중',
                mainline: {
                    want: "",
                    need: "",
                    goal: "",
                    penalty: "",
                    antagonist: "",
                    ending: "",
                    summary: ""
                },
                characters: [],
                relationships: [],
                arcPoints: [],
                episodes: []
            };
            state.stories.push(s);
            saveImmediately();
            renderStories();
            renderHome();
            closeModal();
            viewStoryDetail(s.id, 'foundation');
        }

        function deleteStory(id) {
            if(confirm('이야기를 삭제하면 복구할 수 없습니다. 계속하시겠습니까?')) {
                state.stories = state.stories.filter(s => s.id != id);
                saveImmediately();
                renderStories();
                renderHome();
                closeModal();
            }
        }

        // ==========================================
        //  FAB 버튼 및 공통 핸들러
        // ==========================================
        function handleFab() {
            if (currentTab === 'quests') {
                openModal('새 퀘스트 추가', `
                    <input type="text" id="q-title" placeholder="퀘스트 제목">
                    <textarea id="q-desc" placeholder="상세 내용"></textarea>
                    <div style="display:flex; gap:10px;">
                        <select id="q-grade" style="flex:1">
                            <option value="A">A급 (고보상)</option>
                            <option value="B" selected>B급 (보통)</option>
                            <option value="C">C급 (저보상)</option>
                        </select>
                        <select id="q-cat" style="flex:1">
                            ${state.categories.map(c => `<option>${c}</option>`).join('')}
                        </select>
                    </div>
                    <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-top:6px;">
                        <input type="checkbox" id="q-daily" style="width:auto; margin:0;"> 데일리 퀘스트 (매일 반복)
                    </label>
                `, saveQuest);
            } else if (currentTab === 'ideas') {
                // 연구소 서브탭에 맞는 모달 분기
                if (currentLabSubTab === 'otk') {
                    if (currentOtkMode === 'pred') openNewOtkPredModal();
                    else openNewOtkWowModal();
                } else if (currentLabSubTab === 'life') {
                    openNewLifeStoryModal();
                } else {
                    // 일반 아이디어
                    openModal('💡 새 아이디어 기록', `
                        <textarea id="i-content" placeholder="아이디어를 자유롭게 적으세요..." rows="5"></textarea>
                        <input type="text" id="i-tags" placeholder="태그 (쉼표로 구분)">
                        <select id="i-project">
                            <option value="">연결할 이야기 선택 (선택 안 함)</option>
                            ${state.stories.map(s => `<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('')}
                        </select>
                    `, saveIdea);
                }
            } else {
                openNewStoryModal();
            }
        }

        function saveQuest() {
            const title = document.getElementById('q-title').value.trim();
            if(!title) return;
            const q = {
                id: Date.now(),
                title: title,
                desc: document.getElementById('q-desc').value,
                grade: document.getElementById('q-grade').value,
                category: document.getElementById('q-cat').value,
                isDaily: document.getElementById('q-daily').checked,
                completedAt: null
            };
            state.quests.push(q);
            saveImmediately();
            renderQuests();
            closeModal();
        }

        function saveIdea() {
            const content = document.getElementById('i-content').value.trim();
            if(!content) return;
            const i = {
                id: Date.now(),
                content: content,
                tags: document.getElementById('i-tags').value.split(',').map(t => t.trim()).filter(Boolean),
                projectId: document.getElementById('i-project').value
            };
            state.ideas.push(i);
            saveImmediately();
            renderIdeas();
            closeModal();
        }

        function openRewardSettings() {
            openModal('등급별 보상 설정', `
                <p style="font-size:0.8rem; color:var(--text-muted);">등급별로 획득할 XP와 골드를 설정합니다.</p>
                ${['A', 'B', 'C'].map(g => `
                    <div class="reward-set">
                        <strong>${g}등급:</strong>
                        XP <input type="number" id="reward-${g}-xp" value="${state.rewardConfig[g].xp}" style="width:75px; margin:0">
                        Gold <input type="number" id="reward-${g}-gold" value="${state.rewardConfig[g].gold}" style="width:75px; margin:0">
                    </div>
                `).join('')}
            `, () => {
                ['A', 'B', 'C'].forEach(g => {
                    state.rewardConfig[g].xp = parseInt(document.getElementById(`reward-${g}-xp`).value) || 0;
                    state.rewardConfig[g].gold = parseInt(document.getElementById(`reward-${g}-gold`).value) || 0;
                });
                saveImmediately();
                renderQuests();
                closeModal();
            });
        }

        // ==========================================
        //  모달 제어 유틸리티
        // ==========================================
        function openModal(title, body, onSave) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = body;
            const saveBtn = document.getElementById('modal-save-btn');
            if (onSave) {
                saveBtn.style.display = 'block';
                saveBtn.onclick = onSave;
            } else {
                saveBtn.style.display = 'none';
            }
            document.getElementById('modal-container').classList.remove('hidden');
            autoResizeAllTextareas(document.getElementById('modal-body'));
        }

        function closeModal() {
            saveImmediately();
            document.getElementById('modal-container').classList.add('hidden');
            currentStoryId = null;
            renderHome();
            renderStories();
        }

        function handleModalBackdropClick(event) {
            if (event.target.id === 'modal-container') {
                closeModal();
            }
        }

        // ==========================================
        //  데이터 내보내기 및 가져오기 (C)
        // ==========================================
        function exportData() {
            saveImmediately();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", `writer_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            showToast("데이터 백업 파일이 저장되었습니다.");
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    state = imported;
                    migrateAllData();
                    saveImmediately();
                    renderAll();
                    showToast("데이터 복원이 완료되었습니다.");
                } catch (err) {
                    alert("잘못된 파일 형식이거나 손상된 백업 파일입니다.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 앱 기동
        init();
    </script>
</body>
</html>
